<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#101b35">
<link rel="apple-touch-icon" href="training-icon.png">
<link rel="icon" type="image/png" href="training-icon.png">
<title>Training diese Woche</title>
<style>
:root{color-scheme:light;--navy:#101b35;--blue:#2477ff;--pale:#eef4ff;--muted:#667085}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 40px;background:#f3f5f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto}header{background:linear-gradient(135deg,#101b35,#233e73);color:white;border-radius:24px;padding:24px;margin-bottom:18px}
h1{font-size:25px;margin:0 0 6px}.subtitle{color:#dbe6ff;font-size:14px}.progress-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:14px}
.progress-track{height:8px;background:#ffffff35;border-radius:99px;overflow:hidden;margin-top:10px}.progress-fill{height:100%;width:0;background:#74d6ff;border-radius:99px;transition:width .2s}
.card{background:white;border-radius:20px;padding:16px;box-shadow:0 5px 20px #1720330b;margin-bottom:14px}
.training{display:flex;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid #edf0f5;cursor:pointer}.training:last-child{border-bottom:0}
.training input{width:22px;height:22px;accent-color:var(--blue);flex-shrink:0}.training span{font-size:16px;line-height:1.35}.training.done span{color:#7b8494;text-decoration:line-through}
button{border:0;border-radius:13px;padding:13px 16px;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
.primary{background:var(--navy);color:white;width:100%}.secondary{background:var(--pale);color:#16499a;width:100%;margin-top:10px}
.week-label{font-size:13px;color:var(--muted);margin-top:6px}#historyView{display:none}.history-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.history-head h2{margin:0;font-size:21px}.back{width:auto;padding:10px 12px;background:var(--pale);color:#16499a}
.week-card{border:1px solid #e7ebf2;border-radius:15px;padding:14px;margin-top:10px}.week-title{font-weight:750;font-size:16px}.week-count{color:var(--muted);font-size:13px;margin-top:3px}
.history-list{margin:12px 0 0;padding:0;list-style:none}.history-list li{display:flex;gap:8px;padding:5px 0;font-size:14px}.check{color:#16834a;font-weight:800;width:18px}.unchecked{color:#a0a7b4;width:18px}
.empty{color:var(--muted);line-height:1.5;font-size:14px;padding:8px 0}footer{text-align:center;color:#8b93a2;font-size:12px;padding:8px 0}
</style>
</head>
<body><main>
<section id="mainView">
<header><h1>Training diese Woche</h1><div class="subtitle" id="currentWeek">Kalenderwoche</div>
<div class="progress-row"><span>Wochenfortschritt</span><strong id="progressText">0 von 6</strong></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></header>
<section class="card" id="trainingList"></section>
<button class="primary" id="historyButton">Wochenhistorie ansehen</button>
<div class="week-label">Die Liste beginnt automatisch jeden Montag neu.</div>
</section>
<section id="historyView"><div class="history-head"><h2>Wochenhistorie</h2><button class="back" id="backButton">← Zurück</button></div>
<div class="week-label">Deine gespeicherten Trainingsstände, sortiert nach Kalenderwoche und Jahr.</div><div id="historyList"></div></section>
<footer>Deine Trainingsdaten werden auf diesem Gerät gespeichert.</footer>
</main>
<script>
(() => {
const trainings=["Laufen 5–10 km","Laufen 3–5 km","Schwimmen 2000 m (ABC)","Schwimmen 1500 m","Pier5 Trainingsplan","Pier5 Trainingsplan"];
const STATE_KEY="trainingTrackerStateV2",HISTORY_KEY="trainingTrackerHistoryV2";
function isoWeekInfo(date=new Date()){
 const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);
 const year=d.getUTCFullYear(),yearStart=new Date(Date.UTC(year,0,1));const week=Math.ceil((((d-yearStart)/86400000)+1)/7);
 return {year,week,key:`${year}-KW${String(week).padStart(2,"0")}`,label:`KW ${week} / ${year}`};
}
function readJSON(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch{return fallback}}
let history=readJSON(HISTORY_KEY,{}),state=readJSON(STATE_KEY,null);const current=isoWeekInfo();
if(!state){state={weekKey:current.key,checked:Array(trainings.length).fill(false)}}
else if(state.weekKey!==current.key){
 history[state.weekKey]={checked:Array.isArray(state.checked)?state.checked.slice(0,trainings.length):Array(trainings.length).fill(false),savedAt:new Date().toISOString()};
 state={weekKey:current.key,checked:Array(trainings.length).fill(false)};localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
}
state.checked=Array.from({length:trainings.length},(_,i)=>Boolean(state.checked&&state.checked[i]));
function save(){
 localStorage.setItem(STATE_KEY,JSON.stringify(state));
 history[state.weekKey]={checked:state.checked.slice(),savedAt:new Date().toISOString()};
 localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
}
function renderMain(){
 document.getElementById("currentWeek").textContent=current.label;const list=document.getElementById("trainingList");list.innerHTML="";
 trainings.forEach((name,i)=>{
  const label=document.createElement("label");label.className="training"+(state.checked[i]?" done":"");
  const input=document.createElement("input");input.type="checkbox";input.checked=state.checked[i];
  input.addEventListener("change",()=>{state.checked[i]=input.checked;save();renderMain()});
  const span=document.createElement("span");span.textContent=name;label.append(input,span);list.append(label);
 });
 const count=state.checked.filter(Boolean).length;document.getElementById("progressText").textContent=`${count} von ${trainings.length}`;
 document.getElementById("progressFill").style.width=`${count/trainings.length*100}%`;
}
function renderHistory(){
 const container=document.getElementById("historyList");container.innerHTML="";
 const entries=Object.entries(history).sort((a,b)=>b[0].localeCompare(a[0]));
 if(!entries.length){container.innerHTML='<div class="card empty">Noch gibt es keine gespeicherten Wochen. Deine erste Woche erscheint hier, sobald Trainings abgehakt wurden und die Woche gewechselt hat.</div>';return}
 entries.forEach(([key,data])=>{
  const m=key.match(/^(\d{4})-KW(\d{2})$/),title=m?`KW ${Number(m[2])} / ${m[1]}`:key;
  const checked=Array.isArray(data.checked)?data.checked:[],count=checked.filter(Boolean).length;
  const card=document.createElement("article");card.className="week-card";
  const heading=document.createElement("div");heading.className="week-title";heading.textContent=title;
  const summary=document.createElement("div");summary.className="week-count";summary.textContent=`${count} von ${trainings.length} Trainings erledigt`;
  const list=document.createElement("ul");list.className="history-list";
  trainings.forEach((name,i)=>{const li=document.createElement("li"),mark=document.createElement("span"),text=document.createElement("span");
   mark.className=checked[i]?"check":"unchecked";mark.textContent=checked[i]?"✓":"○";text.textContent=name;li.append(mark,text);list.append(li)});
  card.append(heading,summary,list);container.append(card);
 });
}
document.getElementById("historyButton").addEventListener("click",()=>{renderHistory();document.getElementById("mainView").style.display="none";document.getElementById("historyView").style.display="block";window.scrollTo(0,0)});
document.getElementById("backButton").addEventListener("click",()=>{document.getElementById("historyView").style.display="none";document.getElementById("mainView").style.display="block";window.scrollTo(0,0)});
save();renderMain();
})();
</script></body></html>
